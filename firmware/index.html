<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloJarvice Web Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Startup Screen -->
    <div id="startup-screen">
        <button class="start-btn" id="start-btn">START HOLOJARVICE</button>
    </div>

    <!-- Video Player -->
    <div id="video-container">
        <video id="intro-video" muted>
            <source src="assets/intro.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <!-- Hologram Interface -->
    <div id="hologram-interface">
        <div class="scanlines"></div>
        
        <img id="avatar" src="assets/ai.png" alt="AI Avatar">
        <canvas id="waveform"></canvas>
        
        <!-- Floating Camera Viewport -->
        <div id="camera-viewport">
            <img id="camera-stream" src="" alt="Camera Feed Offline"/>
        </div>
        
        <div class="hud-overlay">
            <div class="hud-header">
                <div class="hud-title">HOLOJARVICE OS v1.0</div>
                <div class="hud-status" id="system-status">SYS: ONLINE</div>
            </div>
            
            <div class="hud-metrics">
                <div class="metric" id="ai-state-box">
                    <div class="label">AI STATE</div>
                    <div class="value" id="ai-state-indicator">[STANDBY]</div>
                </div>
                <div class="metric">
                    <div class="label">CPU LOAD</div>
                    <div class="value" id="cpu-load">12%</div>
                </div>
                <div class="metric">
                    <div class="label">MEM USAGE</div>
                    <div class="value" id="mem-usage">45%</div>
                </div>
                <div class="metric">
                    <div class="label">NET LINK</div>
                    <div class="value">STABLE</div>
                </div>
            </div>

            <div class="hud-footer">
                <div id="status-message">LISTENING FOR VOICE COMMANDS...</div>
                <div id="transcript">"Awaiting Input"</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
